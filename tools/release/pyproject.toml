[project]
name = "ha-automations-release"
version = "0.1.0"
description = "Release command for ha-automations, used in development only"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
release = "ha_automations_release:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_automations_release"]
