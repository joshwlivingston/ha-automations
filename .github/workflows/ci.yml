name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Release tag (vX.Y.Z, not vX.Y.Z.9xxx)
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" | gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file -
