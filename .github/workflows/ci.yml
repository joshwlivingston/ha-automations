name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }

  deploy:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, homelab]
    concurrency: deploy-haos
    environment: haos
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to HAOS
        env:
          HA_SSH: ${{ vars.HA_SSH }}
          HA_SSH_PORT: ${{ vars.HA_SSH_PORT || '22' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/deploy.sh "${GITHUB_REF_NAME}"
