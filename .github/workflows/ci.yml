name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Version bumped over base
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git show FETCH_HEAD:pyproject.toml > /tmp/base-pyproject.toml
          uv run python - <<'EOF'
          import tomllib
          def ver(path):
              return tomllib.load(open(path, "rb"))["project"]["version"]
          base, head = ver("/tmp/base-pyproject.toml"), ver("pyproject.toml")
          key = lambda v: tuple(int(p) for p in v.split("."))
          if key(head) <= key(base):
              raise SystemExit(f"version {head} must be greater than base {base}; run uv version X.Y.Z.9NNN")
          print(f"version {base} -> {head}")
          EOF
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Release tag (vX.Y.Z, not vX.Y.Z.9xxx)
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub release
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" | gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file -
      - uses: astral-sh/setup-uv@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Attach the release's docs
        run: uv run --locked docs attach "$GITHUB_REF_NAME"
