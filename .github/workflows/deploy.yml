# Reusable deploy workflow. Call it from your private config repo
# (see template/config-repo/). It checks out this repo at `version` (default:
# latest tag) for the shims + deploy script, takes apps.yaml from the caller,
# and deploys.
name: Deploy
on:
  workflow_call:
    inputs:
      version:
        description: ha-automations tag to deploy, e.g. v0.2.0 (empty = latest v* tag)
        type: string
        default: ""
      ha_ssh:
        description: ssh target, e.g. root@192.168.1.10
        type: string
        required: true
      ha_ssh_port:
        type: string
        default: "22"
      apps_yaml:
        description: path to apps.yaml in the caller repo
        type: string
        default: apps.yaml
      package_repo:
        description: owner/name of the ha-automations repo (your fork, if any)
        type: string
        required: true
      runs_on:
        description: JSON runner labels; the runner needs SSH access to HAOS
        type: string
        default: '["self-hosted"]'
      environment:
        type: string
        default: haos
      only_if_changed:
        description: skip if the box already runs `version` (for scheduled checks)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: ${{ inputs.environment }}
    concurrency: deploy-haos
    steps:
      - name: Resolve version
        id: v
        env:
          WANT: ${{ inputs.version }}
          URL: ${{ github.server_url }}/${{ inputs.package_repo }}
        run: |
          v=${WANT:-$(git ls-remote --tags --refs "$URL" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)}
          [[ -n "$v" ]] || { echo "no v* tags on $URL"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Compare with deployed version
        id: cmp
        if: inputs.only_if_changed
        env:
          HA_SSH: ${{ inputs.ha_ssh }}
          HA_SSH_PORT: ${{ inputs.ha_ssh_port }}
          SLUG: a0d7b954_appdaemon
        run: |
          current=$(ssh -p "$HA_SSH_PORT" "$HA_SSH" bash -s -- "$SLUG" <<'REMOTE'
          curl -fsS -H "Authorization: Bearer $SUPERVISOR_TOKEN" "http://supervisor/addons/$1/info" \
            | jq -r '.data.options.python_packages // [] | .[] | select(startswith("ha-automations"))'
          REMOTE
          )
          echo "deployed: ${current:-none}"
          if [[ "$current" == *"/archive/refs/tags/${{ steps.v.outputs.version }}.tar.gz" ]]; then
            echo "up to date"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout config
        if: steps.cmp.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: config
      - name: Checkout ha-automations ${{ steps.v.outputs.version }}
        if: steps.cmp.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.package_repo }}
          ref: ${{ steps.v.outputs.version }}
          path: ha-automations
      - name: Deploy to HAOS
        if: steps.cmp.outputs.skip != 'true'
        env:
          HA_SSH: ${{ inputs.ha_ssh }}
          HA_SSH_PORT: ${{ inputs.ha_ssh_port }}
          APPS_YAML: ${{ github.workspace }}/config/${{ inputs.apps_yaml }}
          REPO_URL: ${{ github.server_url }}/${{ inputs.package_repo }}
        run: ha-automations/scripts/deploy.sh "${{ steps.v.outputs.version }}"
