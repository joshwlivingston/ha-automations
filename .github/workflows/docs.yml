name: Docs
on:
  push:
    branches: [main]
  # A new tag adds its version once CI on it passes; for a release, CI has attached its docs by then.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["v*"]
  # A deleted tag drops its version. GitHub sends no event when more than three tags are deleted
  # at once, so uv run release starts this workflow itself after deleting dev tags.
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Runs that skip the build (branch deletes, failed CI) get a group of their own, so they never
  # cancel a real run. Keep this in step with the build job's if.
  group: >-
    ${{ ((github.event_name == 'delete' && github.event.ref_type != 'tag')
    || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'))
    && format('skip-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name != 'delete' || github.event.ref_type == 'tag')
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      # Dev tag docs are cached between runs; a new key is saved when the tags change.
      - id: tags
        run: echo "hash=$(git ls-remote --tags --refs origin 'v*' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .docs-archive
          key: docs-archive-${{ steps.tags.outputs.hash }}
          restore-keys: docs-archive-
      # Release docs come from, and new ones go to, docs-site.tar.gz on each GitHub release.
      - run: uv run --locked docs build --ref HEAD --release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: great-docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
