name: Docs
on:
  push:
    branches: [main]
  # A deleted tag drops its version. release prod deletes old dev tags after the GitHub release
  # exists, so this run also attaches the new release's docs.
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'delete' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      # Dev tag docs are cached between runs; a new key is saved when the tags change.
      - id: tags
        run: echo "hash=$(git ls-remote --tags --refs origin 'v*' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .docs-archive
          key: docs-archive-${{ steps.tags.outputs.hash }}
          restore-keys: docs-archive-
      # Release docs come from, and new ones go to, docs-site.tar.gz on each GitHub release.
      - run: uv run --locked docs build --ref HEAD --release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: great-docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
