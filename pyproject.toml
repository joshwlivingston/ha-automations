[project]
name = "ha-automations"
version = "0.1.0.9010"
description = "Home automations running on AppDaemon"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]  # AppDaemon, which also ships pydantic, is provided by the add-on at runtime

[dependency-groups]
dev = [
    "appdaemon>=4.5.16",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "pyright>=1.1.414",
    "syrupy>=7.0.1",
    "ha-automations-release",
    "ha-automations-docs",
]
docs = [
    "great-docs>=0.17.0",
    "matplotlib>=3.11.2",
]

[tool.uv.sources]
ha-automations-release = { path = "tools/release", editable = true }
ha-automations-docs = { path = "tools/docs", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_automations"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["ha_automations", "ha_automations_release", "ha_automations_docs"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "tools"]
